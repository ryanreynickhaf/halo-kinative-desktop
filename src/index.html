<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halo Kinative</title>
  <style>
    :root { --bg: #fafaf7; --fg: #1d1d1b; --muted: #6b6b66; --line: #dcdcd4; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161615; --fg: #f0f0ea; --muted: #a0a09a; --line: #333330; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(420px, 100% - 32px); }
    h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
    p { color: var(--muted); margin: 0 0 1rem; }
    input, button { font: inherit; padding: .6rem .8rem; border-radius: 6px; border: 1px solid var(--line); }
    input { width: calc(100% - 1.6rem); background: transparent; color: var(--fg); }
    button { margin-top: .75rem; cursor: pointer; background: var(--fg); color: var(--bg); }
    #salam { margin-top: 1rem; min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Halo Kinative</h1>
    <p>Contoh aplikasi desktop kecil.</p>
    <input id="nama" placeholder="Nama kamu" autocomplete="off">
    <button id="sapa">Sapa</button>
    <div id="salam" role="status"></div>
  </main>
  <script>
    document.getElementById('sapa').addEventListener('click', function () {
      var nama = document.getElementById('nama').value.trim() || 'teman';
      document.getElementById('salam').textContent = 'Halo, ' + nama + '!';
    });
  </script>
</body>
</html>
